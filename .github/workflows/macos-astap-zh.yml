name: Build macOS ASTAP-zh

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - astap-zh-windows
    paths:
      - ".github/workflows/macos-astap-zh.yml"
      - "**/*.pas"
      - "**/*.lfm"
      - "**/*.lpi"
      - "languages/**"
  release:
    types:
      - published

jobs:
  macos:
    name: macOS
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Lazarus
        run: |
          brew update
          if [ "$(uname -m)" = "arm64" ]; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          brew install --cask lazarus

      - name: Build ASTAP
        run: |
          set -euo pipefail

          LAZBUILD="$(find /Applications /opt/homebrew /usr/local -name lazbuild -type f 2>/dev/null | head -n 1)"
          if [ -z "$LAZBUILD" ]; then
            echo "lazbuild was not found after installing Lazarus." >&2
            exit 1
          fi

          "$LAZBUILD" --version
          if [ "$(uname -m)" = "arm64" ]; then
            "$LAZBUILD" -B astap_mac_m1.lpi
          else
            "$LAZBUILD" -B astap_mac.lpi
          fi

          test -x astap

      - name: Package macOS app
        run: |
          set -euo pipefail

          ARCH="$(uname -m)"
          DIST="dist"
          APP="$DIST/ASTAP-zh.app"
          VERSION="2026.05.09.${GITHUB_RUN_NUMBER}"
          if [ "$ARCH" = "arm64" ]; then
            OFFICIAL_PKG_URL="https://sourceforge.net/projects/astap-program/files/macOS%20installer/astap_M1.pkg/download"
            PACKAGE_SUFFIX="M1"
          else
            OFFICIAL_PKG_URL="https://sourceforge.net/projects/astap-program/files/macOS%20installer/astap.pkg/download"
            PACKAGE_SUFFIX="x86_64"
          fi

          rm -rf "$DIST" official-astap.pkg official-astap-pkg
          mkdir -p "$DIST"

          curl --fail --location --retry 3 --output official-astap.pkg "$OFFICIAL_PKG_URL"
          pkgutil --expand-full official-astap.pkg official-astap-pkg

          OFFICIAL_APP="$(find official-astap-pkg -name ASTAP.app -type d | head -n 1)"
          if [ -z "$OFFICIAL_APP" ]; then
            echo "Official ASTAP.app was not found in downloaded package." >&2
            find official-astap-pkg -maxdepth 5 -type d >&2
            exit 1
          fi

          cp -R "$OFFICIAL_APP" "$APP"
          install -m 755 astap "$APP/Contents/MacOS/astap"
          mkdir -p "$APP/Contents/Resources/languages"
          cp -R languages/. "$APP/Contents/Resources/languages/"

          /usr/libexec/PlistBuddy -c "Set :CFBundleName ASTAP-zh" "$APP/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier org.hnsky.astap.zh" "$APP/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion zh_CN" "$APP/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "$APP/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$APP/Contents/Info.plist" || true

          xattr -cr "$APP"
          codesign --force --sign - "$APP"

          ditto -c -k --keepParent "$APP" "$DIST/astap_zh_macOS_${PACKAGE_SUFFIX}.zip"
          pkgbuild --install-location /Applications --component "$APP" "$DIST/astap_zh_${PACKAGE_SUFFIX}.pkg"

          shasum -a 256 "$DIST/astap_zh_macOS_${PACKAGE_SUFFIX}.zip" "$DIST/astap_zh_${PACKAGE_SUFFIX}.pkg" > "$DIST/astap_zh_macOS_${PACKAGE_SUFFIX}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTAP-zh-macos
          path: |
            dist/astap_zh_macOS_*.zip
            dist/astap_zh_*.pkg
            dist/astap_zh_macOS_*.sha256

      - name: Attach packages to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/astap_zh_macOS_*.zip
            dist/astap_zh_*.pkg
            dist/astap_zh_macOS_*.sha256
