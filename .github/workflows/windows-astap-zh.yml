name: Build Windows ASTAP-zh

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - astap-zh-windows
    paths:
      - ".github/workflows/windows-astap-zh.yml"
      - "**/*.pas"
      - "**/*.lfm"
      - "**/*.lpi"
      - "languages/**"
  release:
    types:
      - published

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Lazarus and packaging tools
        shell: pwsh
        run: |
          choco install lazarus -y --no-progress
          choco install innosetup -y --no-progress

      - name: Build ASTAP
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles}\Lazarus\lazbuild.exe",
            "${env:ProgramFiles(x86)}\Lazarus\lazbuild.exe",
            "C:\lazarus\lazbuild.exe",
            "C:\ProgramData\chocolatey\bin\lazbuild.exe"
          )

          $lazbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $lazbuild) {
            $command = Get-Command lazbuild.exe -ErrorAction SilentlyContinue
            if ($command) {
              $lazbuild = $command.Source
            }
          }
          if (-not $lazbuild) {
            $found = Get-ChildItem -Path C:\ -Filter lazbuild.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $lazbuild = $found.FullName
            }
          }
          if (-not $lazbuild) {
            throw "lazbuild.exe was not found after installing Lazarus."
          }

          & $lazbuild --version
          & $lazbuild --build-mode=Release -B astap_w64.lpi

          if (-not (Test-Path "astap.exe")) {
            throw "Build finished but astap.exe was not created."
          }

      - name: Package official-style Windows installer and zip
        shell: pwsh
        run: |
          $dist = "dist"
          $official = "official"
          $packageRoot = Join-Path $dist "astap_zh"
          $officialSetup = Join-Path $official "astap_setup.exe"
          $officialInstall = Join-Path $official "installed"

          Remove-Item $dist, $official -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dist, $official, $packageRoot, $officialInstall | Out-Null

          curl.exe --location --fail --retry 3 --output $officialSetup `
            "https://sourceforge.net/projects/astap-program/files/windows_installer/astap_setup.exe/download"

          $setupProcess = Start-Process `
            -FilePath (Resolve-Path $officialSetup).Path `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=$((Resolve-Path $officialInstall).Path)"
            ) `
            -Wait `
            -PassThru
          if ($setupProcess.ExitCode -ne 0) {
            throw "Official ASTAP installer failed with exit code $($setupProcess.ExitCode)."
          }

          $officialAstapPath = Join-Path $officialInstall "astap.exe"
          if (-not (Test-Path $officialAstapPath)) {
            throw "Official astap.exe was not found after silent installation."
          }

          Copy-Item (Join-Path $officialInstall "*") $packageRoot -Recurse -Force
          Get-ChildItem $packageRoot -Filter "unins*.*" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Copy-Item "astap.exe" (Join-Path $packageRoot "astap.exe") -Force
          Copy-Item "languages" (Join-Path $packageRoot "languages") -Recurse -Force
          Copy-Item "copyright.txt" $packageRoot -ErrorAction SilentlyContinue
          Copy-Item "acknowledgement of databases.txt" $packageRoot -ErrorAction SilentlyContinue

          @"
          ASTAP 简体中文本地化构建

          此安装包基于官方 ASTAP Windows 安装内容制作，保留官方目录结构、主程序文件名
          astap.exe 和常见联动方式。

          如果安装到已有官方 ASTAP 目录，本安装包会优先作为最小替换包使用：
          更新 astap.exe、languages\zh_CN\astap.po 和本说明文件，其他官方运行文件仅在缺失
          时补齐，避免覆盖用户已有的官方辅助程序、数据文件和卸载记录。

          如果系统中尚未安装 ASTAP，本安装包会补齐官方 Windows 运行文件，作为完整汉化版
          安装使用。

          原始 ASTAP 项目：https://www.hnsky.org/astap.htm
          本地化源码：https://github.com/songshugong/ASTAP-zh
          许可证：MPL-2.0
          "@ | Set-Content (Join-Path $packageRoot "ASTAP-zh_README.txt") -Encoding UTF8

          Compress-Archive -Path "$packageRoot\*" -DestinationPath (Join-Path $dist "astap_zh.zip") -Force

          $issPath = Join-Path $dist "astap_zh_setup.iss"
          $packageRootForInno = (Resolve-Path $packageRoot).Path
          @"
          [Setup]
          AppName=ASTAP
          AppVerName=ASTAP 2026.05.31
          AppId=ASTAP-zh
          AppPublisher=Han Kleijn 与 ASTAP-zh 贡献者
          AppPublisherURL=https://www.hnsky.org
          AppSupportURL=https://github.com/songshugong/ASTAP-zh
          AppUpdatesURL=https://github.com/songshugong/ASTAP-zh
          DefaultDirName={autopf}\astap
          UninstallFilesDir={commonappdata}\ASTAP-zh\uninstall
          UsePreviousAppDir=no
          PrivilegesRequired=admin
          DefaultGroupName=ASTAP
          AllowNoIcons=yes
          OutputDir=$((Resolve-Path $dist).Path)
          OutputBaseFilename=astap_zh_setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          InfoAfterFile=$packageRootForInno\ASTAP-zh_README.txt

          [Languages]
          Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"

          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加图标："; MinVersion: 4,4

          [Files]
          Source: "$packageRootForInno\astap.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$packageRootForInno\ASTAP-zh_README.txt"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$packageRootForInno\languages\*"; DestDir: "{app}\languages"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$packageRootForInno\*"; DestDir: "{app}"; Excludes: "astap.exe,ASTAP-zh_README.txt,languages\*,unins*.*"; Flags: ignoreversion recursesubdirs createallsubdirs onlyifdoesntexist

          [Icons]
          Name: "{group}\ASTAP"; Filename: "{app}\astap.exe"; WorkingDir: "{app}"
          Name: "{userdesktop}\ASTAP"; Filename: "{app}\astap.exe"; MinVersion: 4,4; Tasks: desktopicon; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\astap.exe"; Description: "启动 ASTAP"; Flags: nowait postinstall skipifsilent

          [Code]
          function LooksLikeAstapDir(Dir: String): Boolean;
          begin
            Result := FileExists(AddBackslash(Dir) + 'astap.exe');
          end;

          procedure UseDirIfAstap(Dir: String; var Found: Boolean);
          begin
            if (not Found) and (Dir <> '') and LooksLikeAstapDir(Dir) then
            begin
              WizardForm.DirEdit.Text := Dir;
              Found := True;
            end;
          end;

          procedure FindAstapInUninstallRoot(RootKey: Integer; var Found: Boolean);
          var
            Names: TArrayOfString;
            I: Integer;
            DisplayName: String;
            InstallLocation: String;
            Key: String;
          begin
            if Found then Exit;
            if not RegGetSubkeyNames(RootKey, 'Software\Microsoft\Windows\CurrentVersion\Uninstall', Names) then Exit;

            for I := 0 to GetArrayLength(Names) - 1 do
            begin
              if Found then Exit;
              Key := 'Software\Microsoft\Windows\CurrentVersion\Uninstall\' + Names[I];
              if RegQueryStringValue(RootKey, Key, 'DisplayName', DisplayName) and
                 (Pos('ASTAP', UpperCase(DisplayName)) > 0) and
                 RegQueryStringValue(RootKey, Key, 'InstallLocation', InstallLocation) then
                UseDirIfAstap(InstallLocation, Found);
            end;
          end;

          procedure InitializeWizard();
          var
            Found: Boolean;
          begin
            Found := False;
            FindAstapInUninstallRoot(HKLM32, Found);
            FindAstapInUninstallRoot(HKLM64, Found);
            FindAstapInUninstallRoot(HKLM, Found);
            FindAstapInUninstallRoot(HKCU, Found);
            UseDirIfAstap(ExpandConstant('{autopf}\astap'), Found);
          end;
          "@ | Set-Content $issPath -Encoding UTF8

          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 5\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 5\ISCC.exe",
            "C:\ProgramData\chocolatey\bin\iscc.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($command) {
              $iscc = $command.Source
            }
          }
          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          $isccDir = Split-Path $iscc -Parent
          $languageDir = Join-Path $isccDir "Languages"
          $chineseLanguageFile = Join-Path $languageDir "ChineseSimplified.isl"
          if (-not (Test-Path $chineseLanguageFile)) {
            New-Item -ItemType Directory -Force $languageDir | Out-Null
            curl.exe --location --fail --retry 3 --output $chineseLanguageFile `
              "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl"
          }
          if (-not (Test-Path $chineseLanguageFile)) {
            throw "ChineseSimplified.isl was not found or downloaded."
          }

          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compiler failed with exit code $LASTEXITCODE."
          }

          Get-ChildItem $dist -File | Where-Object { $_.Name -in @("astap_zh_setup.exe", "astap_zh.zip") } |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash.ToLower())  $($_.Name)"
            } | Set-Content (Join-Path $dist "astap_zh_windows.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTAP-zh-windows
          path: |
            dist/astap_zh_setup.exe
            dist/astap_zh.zip
            dist/astap_zh_windows.sha256

      - name: Attach packages to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/astap_zh_setup.exe
            dist/astap_zh.zip
            dist/astap_zh_windows.sha256
